[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "session-bridge"
version = "0.4.0"
description = "Local, auditable coding-agent session exchange"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pablo Miguel Argudo"}]
requires-python = ">=3.11"
keywords = ["claude-code", "opencode", "codex", "session", "cli", "local-sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = ["typer>=0.16,<1", "rich>=14,<15", "prompt-toolkit>=3.0.52,<4", "pydantic>=2.11,<3", "zstandard>=0.23,<1"]

[project.urls]
Homepage = "https://github.com/pma1999/session-bridge"
Repository = "https://github.com/pma1999/session-bridge"
Documentation = "https://github.com/pma1999/session-bridge#readme"
Issues = "https://github.com/pma1999/session-bridge/issues"
Changelog = "https://github.com/pma1999/session-bridge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sessionbridge = "session_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_bridge"]

[tool.hatch.build.targets.wheel.force-include]
"requirements.lock" = "session_bridge/resources/requirements.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
